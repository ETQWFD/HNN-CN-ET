// Sherpa MNN native library download task
// Only arm64-v8a prebuilt sherpa .so is available from the CDN.
// For armeabi-v7a the sherpa ASR library is not bundled; the Kotlin side
// is expected to gracefully degrade (ASR disabled on 32-bit devices).
task downloadAndUnzipNativeLibs {
    group = 'Pre-build'
    description = 'Downloads and unzips libsherpa-mnn-jni native library from CDN (arm64 only).'
    def nativeLibsUrl = 'https://meta.alicdn.com/data/mnn/libs/libsherpa-mnn-jni-16k.zip'
    def zipFileName = 'libsherpa-mnn-jni-16k.zip'
    def outputDir = file('src/main/jniLibs/arm64-v8a')
    def downloadedZip = new File(project.buildDir, zipFileName)
    def checkFile = new File(outputDir, 'libsherpa-mnn-jni.so')

    inputs.property('url', nativeLibsUrl)
    outputs.file(checkFile)

    doLast {
        println "-> Executing downloadAndUnzipNativeLibs task..."
        println "   Downloading from ${nativeLibsUrl}"
        println "   outputDir  ${outputDir}"

        outputDir.mkdirs()
        downloadedZip.parentFile.mkdirs()

        try {
            ant.get(src: nativeLibsUrl, dest: downloadedZip, timeoutMs: 60000)
        } catch (Exception e) {
            println "   WARN: sherpa download failed (non-fatal): ${e.message}"
            return
        }

        if (!downloadedZip.exists()) {
            println "   WARN: sherpa zip missing, skipping (non-fatal)."
            return
        }
        println "   Download complete. Unzipping..."

        copy {
            from(zipTree(downloadedZip))
            into(outputDir)
        }
        println "   Unzip complete."
        downloadedZip.delete()
    }

    onlyIf {
        def exists = checkFile.exists()
        println "-> Checking if sherpa native lib exists... [Exists: ${exists}]"
        return !exists
    }
}
