<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后台 · HNN CN ET</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="assets/icons/favicon.ico" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-box">
    <h2>管理员访问</h2>
    <p>请输入访问口令。</p>
    <input type="password" id="passInput" placeholder="访问口令" autocomplete="off" />
    <div class="err" id="passErr"></div>
    <button class="btn btn-primary" id="btnUnlock" style="margin-top:14px; width:100%;">进入</button>
    <div class="lock-note">
      口令为 1234。数据来自 GitHub 公开 Releases API。
    </div>
  </div>
</div>

<div id="mainContent" style="display:none;">
  <nav class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.svg" alt="logo" style="width:32px;height:32px;" />
        <span>HNN CN ET · 后台</span>
      </a>
      <div class="nav-links">
        <a href="index.html">返回首页</a>
        <a href="#" id="btnLock" style="display:none;">锁定</a>
      </div>
    </div>
  </nav>

  <section>
    <div class="container">
      <h2 class="section-title">发布与下载统计</h2>
      <p class="section-sub">数据来自 GitHub Releases API，实时拉取。</p>

      <div class="state-box" id="stateBox">正在加载发布数据…</div>

      <div id="statsArea" style="display:none;">
        <div class="stat-grid">
          <div class="stat">
            <div class="label">总下载量</div>
            <div class="value" id="statTotal">0</div>
          </div>
          <div class="stat green">
            <div class="label">最新版本</div>
            <div class="value" id="statLatest" style="font-size:20px;">—</div>
          </div>
          <div class="stat">
            <div class="label">Release 数量</div>
            <div class="value" id="statReleases">0</div>
          </div>
          <div class="stat green">
            <div class="label">Asset 数量</div>
            <div class="value" id="statAssets">0</div>
          </div>
        </div>

        <div class="card" style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th>版本</th>
                <th>发布时间</th>
                <th>Asset</th>
                <th style="text-align:right;">下载次数</th>
              </tr>
            </thead>
            <tbody id="releaseTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <section id="announceSec" style="display:none;">
    <div class="container">
      <h2 class="section-title">发布公告</h2>
      <p class="section-sub">发布后，App 启动时会弹出一次新公告，官网顶部也会显示。</p>
      <div class="card">
        <div class="field">
          <label>公告标签（可选，如「公告」/「活动」）</label>
          <input type="text" id="annTag" placeholder="公告" />
        </div>
        <div class="field">
          <label>标题</label>
          <input type="text" id="annTitle" placeholder="例如：v1.0.2 已发布" />
        </div>
        <div class="field">
          <label>内容</label>
          <textarea id="annContent" rows="4" placeholder="公告正文"></textarea>
        </div>
        <div class="field">
          <label>GitHub Token（用于写入 announcement.json，只保存在本机浏览器）</label>
          <input type="password" id="ghToken" placeholder="ghp_xxx 或 gho_xxx" autocomplete="off" />
        </div>
        <div class="field" style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-primary" id="btnPublish">发布公告</button>
          <span class="state-mini" id="publishState"></span>
        </div>
      </div>
    </div>
  </section>
</div>

<script>
(function () {
  var ADMIN_KEY = 'hnn_admin_1234';
  var ADMIN_PASS = '1234';
  var LS_KEY = 'hnn_admin_ok';
  var REPO = 'ETQWFD/HNN-CN-ET';
  var API_ALL = 'https://api.github.com/repos/' + REPO + '/releases?per_page=100';
  var CONTENT_API = 'https://api.github.com/repos/' + REPO + '/contents/docs/announcement.json';

  function $(id) { return document.getElementById(id); }

  function unlock() {
    $('lockOverlay').style.display = 'none';
    $('mainContent').style.display = 'block';
    loadData();
    $('btnLock').style.display = 'inline-block';
    $('announceSec').style.display = 'block';
  }

  var q = new URLSearchParams(location.search);
  if (q.get('key') === ADMIN_KEY) {
    try { localStorage.setItem(LS_KEY, '1'); } catch (e) {}
  }
  var remembered = false;
  try { remembered = localStorage.getItem(LS_KEY) === '1'; } catch (e) {}

  if (remembered) {
    unlock();
  } else {
    $('btnUnlock').addEventListener('click', tryUnlock);
    $('passInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') tryUnlock();
    });
  }

  function tryUnlock() {
    var v = ($('passInput').value || '').trim();
    if (v === ADMIN_PASS) {
      try { localStorage.setItem(LS_KEY, '1'); } catch (e) {}
      unlock();
    } else {
      $('passErr').textContent = '口令不正确';
    }
  }

  $('btnLock').addEventListener('click', function (e) {
    e.preventDefault();
    try { localStorage.removeItem(LS_KEY); } catch (e) {}
    location.search = '';
    location.reload();
  });

  function fmtDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  function fmtNum(n) {
    n = n || 0;
    return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  function setState(msg, isErr) {
    var box = $('stateBox');
    box.style.display = 'block';
    box.textContent = msg;
    box.className = 'state-box' + (isErr ? ' error' : '');
  }

  function showTable() {
    $('stateBox').style.display = 'none';
    $('statsArea').style.display = 'block';
  }

  function loadData() {
    setState('正在从 GitHub 拉取发布数据…');
    fetch(API_ALL, { headers: { 'Accept': 'application/vnd.github+json' } })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (list) {
        if (!Array.isArray(list) || list.length === 0) {
          setState('还没有任何 Release。');
          return;
        }
        var total = 0, assetCount = 0;
        var rows = [];
        list.forEach(function (rel) {
          var assets = rel.assets || [];
          assetCount += assets.length;
          assets.forEach(function (a) {
            total += (a.download_count || 0);
            rows.push({
              tag: rel.tag_name || rel.name || '—',
              date: rel.published_at,
              asset: a.name,
              dl: a.download_count || 0,
              url: a.browser_download_url
            });
          });
          if (assets.length === 0) {
            rows.push({ tag: rel.tag_name || rel.name || '—', date: rel.published_at, asset: '(无 asset)', dl: 0, url: null });
          }
        });

        $('statTotal').textContent = fmtNum(total);
        $('statReleases').textContent = list.length;
        $('statAssets').textContent = assetCount;
        $('statLatest').textContent = list[0] ? (list[0].tag_name || list[0].name || '—') : '—';

        var tbody = $('releaseTable');
        tbody.innerHTML = '';
        rows.forEach(function (r) {
          var tr = document.createElement('tr');
          var tdTag = document.createElement('td'); tdTag.textContent = r.tag;
          var tdDate = document.createElement('td'); tdDate.textContent = fmtDate(r.date);
          var tdAsset = document.createElement('td');
          if (r.url) {
            var a = document.createElement('a');
            a.href = r.url; a.target = '_blank'; a.rel = 'noopener';
            a.textContent = r.asset;
            tdAsset.appendChild(a);
          } else {
            tdAsset.textContent = r.asset;
          }
          var tdDl = document.createElement('td');
          tdDl.className = 'num';
          tdDl.textContent = fmtNum(r.dl);
          tr.appendChild(tdTag); tr.appendChild(tdDate); tr.appendChild(tdAsset); tr.appendChild(tdDl);
          tbody.appendChild(tr);
        });

        showTable();
      })
      .catch(function (err) {
        setState('加载失败：' + err.message + '。请检查网络后刷新重试。', true);
      });
  }

  var tokenInput = $('ghToken');
  try {
    var savedToken = localStorage.getItem('hnn_gh_token');
    if (savedToken) tokenInput.value = savedToken;
  } catch (e) {}

  $('btnPublish').addEventListener('click', function () {
    var tag = ($('annTag').value || '').trim();
    var title = ($('annTitle').value || '').trim();
    var content = ($('annContent').value || '').trim();
    var token = (tokenInput.value || '').trim();
    var state = $('publishState');

    if (!title || !content) {
      state.textContent = '标题和内容不能为空';
      return;
    }
    if (!token) {
      state.textContent = '请填写 GitHub Token';
      return;
    }
    try { localStorage.setItem('hnn_gh_token', token); } catch (e) {}

    var id = new Date().toISOString().slice(0, 10) + '-' + String(Math.floor(Date.now() / 1000) % 100000);
    var payload = {
      id: id,
      tag: tag || '公告',
      title: title,
      content: content,
      publishedAt: new Date().toISOString()
    };

    state.textContent = '正在读取现有 announcement.json…';
    fetch(CONTENT_API, { headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' } })
      .then(function (r) { return r.json(); })
      .then(function (existing) {
        var sha = existing && existing.sha ? existing.sha : null;
        state.textContent = '正在发布…';
        return fetch(CONTENT_API, {
          method: 'PUT',
          headers: {
            'Authorization': 'token ' + token,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'publish announcement ' + id,
            content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2)))),
            sha: sha || undefined
          })
        });
      })
      .then(function (r) {
        if (!r.ok) {
          return r.json().then(function (j) {
            throw new Error((j && j.message) || ('HTTP ' + r.status));
          });
        }
        return r.json();
      })
      .then(function () {
        state.textContent = '发布成功。App 下次启动会展示这条公告。';
        $('annContent').value = '';
        $('annTitle').value = '';
      })
      .catch(function (err) {
        state.textContent = '发布失败：' + err.message;
      });
  });
})();
</script>
</body>
</html>
