// Top-level build file where you can add configuration options common to all sub-projects/modules.
plugins {
    id 'com.android.application' version '8.7.3' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.21'
    id 'org.jetbrains.kotlin.android' version '2.1.21' apply false
    id 'com.google.gms.google-services' version '4.4.4' apply false
    id 'com.google.firebase.crashlytics' version '3.0.3' apply false
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
}

compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

compileTestKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}

// HNN CN ET v1.3.4: AGP 8.7.3 lint cannot parse build-tools 37.0.x version string
// ("For input string: \"37.0\"") in lintVital on release builds. Disable lintVital
// task graph (local packaging only; lint still run separately when needed).
allprojects {
    tasks.whenTaskAdded { t ->
        if (t.name.startsWith('lintVital')) {
            t.enabled = false
        }
    }
}